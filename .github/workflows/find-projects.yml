name: Find New Projects

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  find-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to commit changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use a stable Python version compatible with google-generativeai

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Find new projects
        run: python scripts/find_new_projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(bot): Automatically find and add new projects"
          file_pattern: "projects.yaml README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          # Force push to handle any potential conflicts (be careful!)
          push_options: --force-with-lease