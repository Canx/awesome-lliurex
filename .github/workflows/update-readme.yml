name: Update README

on:
  push:
    branches:
      - main # Runs whenever a change is pushed to main
  workflow_dispatch: # Allows manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to commit changes
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Generate README sorted by name
        run: python scripts/generate_readme.py --sort-by name --output README_ALPHABETICAL.md

      - name: Generate README sorted by update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_readme.py --sort-by update --output README_BY_DATE.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(readme): Automatically update project lists"
          file_pattern: "README.md README_ALPHABETICAL.md README_BY_DATE.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"